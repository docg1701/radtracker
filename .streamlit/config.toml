# .streamlit/config.toml — radtracker theme configuration
# Light theme is the default. Dark theme activates via Streamlit Settings menu.
# DESIGN_SPEC §7.3 — token mapping for both themes.

[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

# Dark mode: Streamlit auto-inverts light-theme colors when the user selects
# ☰ → Settings → Theme → Dark. All charts use transparent backgrounds
# (rgba(0,0,0,0)) so they inherit the theme correctly.

[browser]
gatherUsageStats = false

[server]
headless = true
