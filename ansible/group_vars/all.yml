          3336396262393334350a626639333634383965643466656138346235656430323135353237323566
          66643932643134303835373033646539313832353637333566343164396161383532613738626164
          3761363235366533626438326531653033303161383864626131

# Path to SSH deploy key generated on VPS for GitHub access
deploy_key_path: "/home/{{ ansible_user }}/.ssh/radtracker_deploy"

# BasicAuth: generate with: docker run --rm caddy:2.9-alpine caddy hash-password --plaintext "password"
