---
# Avoid interpreter discovery warning on Debian 13 (python3.13)
ansible_python_interpreter: /usr/bin/python3

# Project root on VPS (in the ansible_user's home directory)
radtracker_dir: "/home/{{ ansible_user }}/radtracker"
radtracker_data_dir: "{{ radtracker_dir }}/data"
radtracker_backup_dir: "{{ radtracker_dir }}/backups"

# Deployment mode: "internet" or "lan"
# Override at deploy time: -e deployment_mode=lan
deployment_mode: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      34653439373739616366653164356266323962383965313734356535333865363461346533633339
      6332333132663632363366383332303662316430663665630a346437366534326133666638313439
