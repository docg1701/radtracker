      6232636531316332620a333731306561383838353564623030653465313334303335396439643136
      6235

# Domain (only used in internet mode)
domain: radtracker.example.com

# GitHub private repository (SSH URL)
github_repo: git@github.com:docg1701/radtracker.git
github_branch: master

# GitHub Personal Access Token (classic) with 'repo' scope
# Used to register the deploy key via API. Encrypt with:
#   ansible-vault encrypt_string "ghp_YOUR_TOKEN" --name github_pat
