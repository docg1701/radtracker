[project]
name = "radtracker"
version = "1.6.7"
description = "Personal productivity dashboard for teleradiology"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.54.0,<2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "streamlit-extras>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "yamllint>=1.38.0",
    "ansible-lint>=26.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_configs = true
